name: AggregatorApp

options:
  bundleIdPrefix: net.renalias
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  AggregatorApp:
    type: application
    platform: iOS
    sources:
      - path: AggregatorApp
      - path: AggregatorApp/iPad
    dependencies:
      - target: AggregatorWidget
    entitlements:
      path: AggregatorApp/AggregatorApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.renalias.AggregatorApp
        keychain-access-groups:
          - $(AppIdentifierPrefix)net.renalias.AggregatorApp.shared
    info:
      path: AggregatorApp/Info.plist
      properties:
        # Without these, xcodegen writes its literal defaults (1.0 / 1) into the
        # generated plist and MARKETING_VERSION / CURRENT_PROJECT_VERSION below
        # are silently ignored for the app, leaving it out of step with the
        # widget (which generates its plist from those settings).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: net.renalias.AggregatorApp
            CFBundleURLSchemes:
              - aggregator
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QEZ63CXN26
        PRODUCT_BUNDLE_IDENTIFIER: net.renalias.AggregatorApp
        MARKETING_VERSION: 1.1
        CURRENT_PROJECT_VERSION: 5
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - AggregatorAppTests

  AggregatorWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AggregatorWidget
      - path: AggregatorApp/Common/APIClient.swift
      - path: AggregatorApp/Common/KeychainHelper.swift
      - path: AggregatorApp/Common/CredentialsStore.swift
      - path: AggregatorApp/Common/DateDisplay.swift
      - path: AggregatorApp/Common/Error+Cancellation.swift
      - path: AggregatorApp/Models
      - path: AggregatorApp/Articles/ArticleFeed.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: AggregatorWidget/AggregatorWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.renalias.AggregatorApp
        keychain-access-groups:
          - $(AppIdentifierPrefix)net.renalias.AggregatorApp.shared
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QEZ63CXN26
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Aggregator
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        PRODUCT_BUNDLE_IDENTIFIER: net.renalias.AggregatorApp.AggregatorWidget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        # Must match the app target: an extension's CFBundleVersion has to equal
        # its containing app's, or the build warns and App Store upload fails.
        CURRENT_PROJECT_VERSION: 5
        MARKETING_VERSION: 1.1

  AggregatorAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AggregatorAppTests
      - path: AggregatorWidget/ContentSourceIntent.swift
      - path: AggregatorWidget/ImageDownsampler.swift
    dependencies:
      - target: AggregatorApp
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: net.renalias.AggregatorAppTests
